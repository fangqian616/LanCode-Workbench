<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AGY Web Workbench Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="55%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0e1314"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="76%" cy="38%" r="46%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <clipPath id="outerClip">
      <rect x="0" y="0" width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <!-- Canvas & subtle grid -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#gridPattern)"/>
    <rect width="1200" height="320" fill="url(#emeraldGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="rgba(255,255,255,0.10)"/>

    <!-- Left side: Brand pill, Title, Subtitle, Status Badges -->
    <g transform="translate(56, 48)">
      <!-- Eyebrow pill -->
      <rect x="0" y="0" width="248" height="26" rx="13" fill="rgba(52,211,153,0.10)" stroke="rgba(52,211,153,0.32)"/>
      <circle cx="15" cy="13" r="4" fill="#34d399"/>
      <text x="27" y="17" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a7f3d0" letter-spacing="0.06em">MULTI-USER ACP WORKBENCH</text>

      <!-- Main Title -->
      <text x="0" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#f4f6f8" letter-spacing="-0.03em">AGY WEB WORKBENCH</text>

      <!-- Subtitle -->
      <text x="0" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#9ca3af">Turn one Antigravity CLI host into an isolated multi-user browser workbench</text>
      <text x="0" y="133" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#6b7280">Per-user workspaces, real-time ACP streaming, drag-and-drop &amp; Syncthing sync.</text>

      <!-- Feature Status Badges -->
      <g transform="translate(0, 168)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">
        <!-- Badge 1 -->
        <rect x="0" y="0" width="128" height="28" rx="6" fill="#15181e" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="14" cy="14" r="3.5" fill="#34d399"/>
        <text x="25" y="18" fill="#e5e7eb">ACP Streaming</text>

        <!-- Badge 2 -->
        <rect x="138" y="0" width="154" height="28" rx="6" fill="#15181e" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="152" cy="14" r="3.5" fill="#34d399"/>
        <text x="163" y="18" fill="#e5e7eb">Folder Drag &amp; Drop</text>

        <!-- Badge 3 -->
        <rect x="302" y="0" width="126" height="28" rx="6" fill="#15181e" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="316" cy="14" r="3.5" fill="#34d399"/>
        <text x="327" y="18" fill="#e5e7eb">Live SSE Tree</text>

        <!-- Badge 4 -->
        <rect x="438" y="0" width="164" height="28" rx="6" fill="#15181e" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="452" cy="14" r="3.5" fill="#34d399"/>
        <text x="463" y="18" fill="#e5e7eb">Syncthing 2-Way Sync</text>
      </g>

      <!-- Bottom caption -->
      <text x="0" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7280">Zero external npm runtime deps  ·  Node.js &gt;= 20  ·  Windows 10 / 11</text>
    </g>

    <!-- Right side: 3-column geometric mini-workbench schematic -->
    <g transform="translate(716, 34)">
      <rect x="0" y="0" width="430" height="252" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)"/>
      <!-- Window chrome -->
      <rect x="0" y="0" width="430" height="28" rx="12" fill="#181b22"/>
      <rect x="0" y="16" width="430" height="12" fill="#181b22"/>
      <line x1="0" y1="28" x2="430" y2="28" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="16" cy="14" r="4" fill="#ef4444" fill-opacity="0.75"/>
      <circle cx="29" cy="14" r="4" fill="#f59e0b" fill-opacity="0.75"/>
      <circle cx="42" cy="14" r="4" fill="#34d399" fill-opacity="0.85"/>
      <text x="64" y="17.5" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ca3af">/workbench?token=user_***</text>
      <rect x="352" y="7" width="66" height="14" rx="7" fill="rgba(52,211,153,0.14)" stroke="rgba(52,211,153,0.35)"/>
      <circle cx="362" cy="14" r="2.5" fill="#34d399"/>
      <text x="369" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6ee7b7">ACP LIVE</text>

      <!-- Col 1: Sessions sidebar -->
      <rect x="10" y="38" width="92" height="204" rx="7" fill="#0d0f13" stroke="rgba(255,255,255,0.07)"/>
      <rect x="18" y="47" width="76" height="18" rx="4" fill="rgba(52,211,153,0.16)" stroke="rgba(52,211,153,0.38)"/>
      <text x="26" y="59" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#a7f3d0">+ New Task</text>
      <rect x="18" y="74" width="76" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
      <rect x="24" y="81" width="46" height="4" rx="2" fill="#e5e7eb"/>
      <rect x="24" y="88" width="32" height="3" rx="1.5" fill="#6b7280"/>
      <rect x="18" y="102" width="76" height="20" rx="4" fill="transparent"/>
      <rect x="24" y="109" width="54" height="4" rx="2" fill="#6b7280"/>
      <rect x="18" y="128" width="76" height="20" rx="4" fill="transparent"/>
      <rect x="24" y="135" width="42" height="4" rx="2" fill="#4b5563"/>
      <rect x="18" y="212" width="76" height="20" rx="4" fill="#131720" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="27" cy="222" r="3" fill="#34d399"/>
      <text x="35" y="225" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#9ca3af">alice_dev</text>

      <!-- Col 2: Agent Chat & Tool Cards -->
      <rect x="110" y="38" width="194" height="204" rx="7" fill="#0d0f13" stroke="rgba(255,255,255,0.07)"/>
      <!-- User prompt bubble -->
      <rect x="164" y="48" width="130" height="24" rx="6" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.28)"/>
      <rect x="174" y="57" width="96" height="4" rx="2" fill="#d1fae5"/>
      <!-- Thought block -->
      <rect x="120" y="80" width="174" height="32" rx="5" fill="#13161d" stroke="rgba(255,255,255,0.07)"/>
      <text x="128" y="93" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af">Thought (1.8s)</text>
      <rect x="128" y="100" width="134" height="3.5" rx="1.7" fill="#4b5563"/>
      <!-- Tool execution badge -->
      <rect x="120" y="119" width="174" height="26" rx="5" fill="rgba(52,211,153,0.07)" stroke="rgba(52,211,153,0.22)"/>
      <circle cx="131" cy="132" r="3.5" fill="#34d399"/>
      <text x="140" y="135" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0">write_file: server.ts</text>
      <!-- Assistant stream bars -->
      <rect x="120" y="154" width="152" height="4.5" rx="2" fill="#d1d5db"/>
      <rect x="120" y="164" width="166" height="4.5" rx="2" fill="#9ca3af"/>
      <rect x="120" y="174" width="118" height="4.5" rx="2" fill="#6b7280"/>
      <!-- Composer -->
      <rect x="118" y="206" width="178" height="28" rx="6" fill="#151922" stroke="rgba(255,255,255,0.11)"/>
      <text x="127" y="223" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#6b7280">Hydrogen · Code</text>
      <rect x="272" y="212" width="18" height="16" rx="4" fill="#34d399"/>
      <path d="M278 220 L284 220 M281 217 L284 220 L281 223" stroke="#0b0c0e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Col 3: Workspace File Tree + Preview -->
      <rect x="312" y="38" width="108" height="204" rx="7" fill="#0d0f13" stroke="rgba(255,255,255,0.07)"/>
      <text x="320" y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#9ca3af">FILES</text>
      <circle cx="404" cy="49" r="3" fill="#34d399"/>
      <text x="378" y="52" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6ee7b7">SSE</text>
      <!-- Tree items -->
      <rect x="318" y="61" width="96" height="16" rx="3" fill="rgba(52,211,153,0.10)"/>
      <circle cx="326" cy="69" r="2.5" fill="#34d399"/>
      <text x="333" y="72" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a7f3d0">server.ts</text>
      <text x="333" y="88" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9ca3af">README.md</text>
      <text x="333" y="104" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">sunset.svg</text>
      <!-- Preview box -->
      <line x1="312" y1="140" x2="420" y2="140" stroke="rgba(255,255,255,0.07)"/>
      <rect x="319" y="148" width="94" height="86" rx="5" fill="#12151c" stroke="rgba(255,255,255,0.07)"/>
      <text x="326" y="162" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#34d399">1  import { serve }</text>
      <text x="326" y="174" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#9ca3af">2  const app =</text>
      <text x="326" y="186" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6b7280">3    createPortal()</text>
      <rect x="326" y="198" width="80" height="28" rx="4" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.22)" stroke-dasharray="3 2"/>
      <text x="342" y="215" font-family="Inter, sans-serif" font-size="7.5" fill="#a7f3d0">Drop folder</text>
    </g>
  </g>
</svg>
